<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>iPad-Führerschein – Hauptmenü</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <span class="logo">🎓 iPad-Führerschein</span>
</header>

<main id="app">
  <section class="screen active">
    <div class="card">
      <h1>iPad-Führerschein</h1>
      <p>Google Workspace Edition · Klasse 7</p>
      <p>Willkommen! Arbeite dich Station für Station durch die Module. Dein Fortschritt wird auf diesem iPad/Browser gespeichert.</p>

      <div class="hub-progress">
        <div class="progress-label" id="hubProgressLabel">0 von 5 Bausteinen abgeschlossen</div>
        <div class="progress-bar"><div class="progress-fill" id="hubProgressFill"></div></div>
      </div>

      <div class="hub-list" id="hubList"></div>
    </div>
  </section>
</main>

<script src="hub.js"></script>
</body>
</html>
